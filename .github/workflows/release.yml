name: Release

# Pushing a tag like v0.2.0 builds the Windows installer and publishes it as a
# GitHub release, which installed copies pick up through auto-update.
on:
  push:
    tags: ['v*']

# Two tags pushed together publish one after the other.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      # Actions pinned to a commit: a moved tag cannot change what runs here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The token publishes through GH_TOKEN below; it need not sit in .git/config while npm scripts run.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      # The release is named after package.json: a tag that says otherwise would publish another version.
      - name: Tag matches package.json
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version. Bump the version, then tag."
            exit 1
          fi
      # A release already published is never touched again: a rerun would replace its installer
      # (another sha512 than the one installed copies saw), or skip publishing and still pass.
      - name: Release not yet published
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          draft=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null || echo none)
          if [ "$draft" = "false" ]; then
            echo "::error::Release $GITHUB_REF_NAME is already published. Bump the version and tag again."
            exit 1
          fi
      - run: npm ci
      # CI does not run on tags: the commit being released is checked here.
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build
      # Uploaded to a draft (releaseType in package.json), which installed copies do not see yet.
      - run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional code signing: without these secrets the installer is unsigned
          # and Windows SmartScreen warns on first launch.
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      # Published only now, every file in place: published first, a failed upload left a "latest"
      # release without its installer or latest.yml, and every installed copy failed to update.
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
