name: Release

# Pushing a tag like v0.2.0 builds the Windows installer and publishes it as a
# GitHub release, which installed copies pick up through auto-update.
on:
  push:
    tags: ['v*']

# Two tags pushed together publish one after the other.
concurrency:
  group: release
  cancel-in-progress: false

# Nothing by default: each job asks for what it needs.
permissions: {}

jobs:
  # Everything that runs the project's code and its dev tools (npm ci, lint, tests, the build)
  # runs here, with a read-only token and no secret: a dependency compromised could not publish.
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      # Actions pinned to a commit: a moved tag cannot change what runs here.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          # The whole history, to tell whether the tagged commit is on main.
          fetch-depth: 0
      # Only what reached main is released: a tag pushed on a branch nobody reviewed would otherwise
      # go to every installed copy through auto-update.
      - name: Tagged commit is on main
        shell: bash
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points at a commit that is not on main. Merge first, then tag main."
            exit 1
          fi
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      # The release is named after package.json: a tag that says otherwise would publish another version.
      - name: Tag matches package.json
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version. Bump the version, then tag."
            exit 1
          fi
      - run: npm ci
      # CI does not run on tags: the commit being released is checked here.
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: app
          if-no-files-found: error
          path: out/

  # The code-signing certificate and its password are only ever in this job. Packaged in the job
  # above, they were within reach of every dev dependency's install script and of everything the
  # lint, checks, tests and build ran, any of which could patch electron-builder to take them. Here
  # no install script runs and nothing of the project's tooling does: only electron-builder, on
  # the bundles built above.
  package:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      # The app's own dependencies (packed into it) and electron-builder, which downloads Electron itself.
      - run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app
          path: out
      # The installer and latest.yml (what auto-update reads), not published from here.
      - run: npx electron-builder --win --publish never
        env:
          # Optional code signing: without these secrets the installer is unsigned
          # and Windows SmartScreen warns on first launch.
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      # The installed app starts and shows its interface (see src/main/smoke.ts).
      - name: Start the packaged app
        shell: bash
        run: |
          timeout 120 "release/win-unpacked/GaetanDev Git.exe" --smoke
          test -f release/win-unpacked/resources/gdg-askpass.exe
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml

  # Only this job can write to the repository, and it runs nothing of the project: it uploads
  # the files built above, then publishes the release once every one is in place.
  publish:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      # A release already published is never touched again: its installer would be replaced
      # (another sha512 than the one installed copies saw).
      - name: Release not yet published
        run: |
          draft=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null || echo none)
          if [ "$draft" = "false" ]; then
            echo "::error::Release $GITHUB_REF_NAME is already published. Bump the version and tag again."
            exit 1
          fi
          # A draft left by a failed run is replaced whole.
          if [ "$draft" = "true" ]; then gh release delete "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --yes; fi
      # Uploaded to a draft, which installed copies do not see, then published: published first,
      # a failed upload left a "latest" release without its installer or latest.yml, and every
      # installed copy failed to update. A tag with a suffix (v0.3.0-beta.1) is a pre-release,
      # never "latest", which every installed copy updates to, stable ones included.
      - name: Publish the release
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$GITHUB_REF_NAME" --generate-notes release/*
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
          else
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          fi
