name: Release

# Pushing a tag like v0.2.0 builds the Windows installer and publishes it as a
# GitHub release, which installed copies pick up through auto-update.
on:
  push:
    tags: ['v*']

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The token publishes through GH_TOKEN below; it need not sit in .git/config while npm scripts run.
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The release is named after package.json: a tag that says otherwise would publish another version.
      - name: Tag matches package.json
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version. Bump the version, then tag."
            exit 1
          fi
      - run: npm ci
      # CI does not run on tags: the commit being released is checked here.
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build
      # releaseType "release" (package.json): published at once, not left as a draft auto-update cannot see.
      - run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional code signing: without these secrets the installer is unsigned
          # and Windows SmartScreen warns on first launch.
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
